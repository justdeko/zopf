name: Prune the stable dmg

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - name: Drop the stable dmg from every other published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: ${{ github.event.release.tag_name }}
        run: |
          ASSET="zopf-macos-arm64.dmg"
          gh release list --repo "$REPO" --limit 30 --json tagName,isDraft \
            --jq '.[] | select(.isDraft | not) | .tagName' |
            while IFS= read -r tag; do
              if [ "$tag" = "$KEEP" ]; then continue; fi
              if gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[].name' |
                grep -Fqx "$ASSET"; then
                gh release delete-asset "$tag" "$ASSET" --repo "$REPO" --yes
                echo "removed $ASSET from $tag"
              fi
            done
