name: canvas-states
description: Show every node status on the canvas at once, without spending anything.
repos:
  - id: self
    path: ..
defaults:
  repo: self
nodes:
  - id: start
    type: shell
    title: Start the run
    command: sleep 1; echo ready
  - id: pick
    type: branch
    title: Did the first node say ready?
    expression: ${start.result} == ready
  - id: ask
    type: input
    title: Which arm looks right?
    default: green
    choices:
      - green
      - red
    prompt: Pick one so the gate has something to show.
  - id: hold
    type: gate
    title: Let the run past?
    prompt: You answered ${ask.result}.
  - id: untaken
    type: shell
    title: Skipped by the branch
    command: echo "this never runs either"
  - id: flaky
    type: shell
    title: Fail on purpose
    command: sleep 4; echo "exiting 1" >&2; exit 1
  - id: repair
    type: shell
    title: Catch the failure
    command: sleep 3; echo "repaired"
  - id: never
    type: shell
    title: Skipped by a failed dependency
    command: echo "this never runs"
  - id: slow
    type: shell
    title: Twenty seconds of work
    command: sleep 20; echo "the slow arm finished"
  - id: join
    type: shell
    title: Join every arm
    command: echo "slow=${slow.result} repair=${repair.result} gate=${hold.result}"
  - id: boom
    type: shell
    title: Fail with nothing to catch it
    command: sleep 2; echo "nothing handles this" >&2; exit 3
edges:
  - from: start
    to: slow
  - from: start
    to: flaky
  - from: start
    to: pick
  - from: flaky
    to: repair
    on: failure
  - from: flaky
    to: never
  - from: pick
    to: ask
    when: true
  - from: pick
    to: untaken
    when: false
  - from: ask
    to: hold
  - from: slow
    to: join
  - from: repair
    to: join
  - from: hold
    to: join
  - from: join
    to: boom
