name: provider-smoke
description: One turn through claude, codex and dsh, to check the provider seam. Costs money.
repos:
  - id: self
    path: ..
defaults:
  repo: self
nodes:
  - id: reachable
    type: shell
    title: Which CLIs are on PATH?
    command: for c in claude codex dsh; do printf '%s = ' "$c"; command -v "$c" >/dev/null 2>&1 && "$c" --version 2>&1 | head -1 || echo "not on PATH"; done
  - id: viaClaude
    type: agent
    provider: claude
    title: One turn through claude
    timeoutSeconds: 300
    prompt: Reply with exactly one short sentence naming the model you are. Do not read or write any files.
  - id: viaCodex
    type: agent
    provider: codex
    title: One turn through codex
    timeoutSeconds: 300
    prompt: Reply with exactly one short sentence naming the model you are. Do not read or write any files.
  - id: viaDsh
    type: agent
    provider: dsh
    title: One turn through dsh
    timeoutSeconds: 300
    prompt: Reply with exactly one short sentence naming the model you are. Do not read or write any files.
  - id: compare
    type: gate
    title: Did each answer as itself?
    prompt: |-
      ${reachable.result}

      claude: ${viaClaude.result}

      codex: ${viaCodex.result}

      dsh: ${viaDsh.result}
edges:
  - from: reachable
    to: viaClaude
  - from: reachable
    to: viaCodex
  - from: reachable
    to: viaDsh
  - from: viaClaude
    to: compare
  - from: viaCodex
    to: compare
  - from: viaDsh
    to: compare
