name: smoke
description: Test the engine end to end for free. Run it after touching WorkflowEngine.
repos:
  - id: self
    path: ..
defaults:
  repo: self
nodes:
  - id: probe
    type: shell
    title: Is the claude CLI reachable?
    command: claude --version
  - id: missing
    type: connector
    title: Say it is not on PATH
    connector: macos-notify
    inputs:
      title: zopf smoke
      subtitle: claude CLI
      message: Not on PATH. A packaged build asks the login shell for its environment, so check that `claude` resolves in a login zsh.
      sound: Basso
  - id: expected
    type: branch
    title: Same version as last run?
    expression: ${probe.result} == 2.1.234 (Claude Code)
  - id: confirm
    type: gate
    title: Send the notification?
    prompt: ${probe.result}
  - id: notify
    type: connector
    title: Say so in Notification Center
    connector: macos-notify
    inputs:
      title: zopf smoke
      subtitle: claude CLI
      message: ${probe.result}
  - id: moved
    type: connector
    title: Say the CLI has moved
    connector: macos-notify
    inputs:
      title: zopf smoke
      subtitle: claude CLI moved
      message: ${probe.result} — smoke was last run against 2.1.234. The CLI moved; re-check whatever leans on its output.
      sound: Basso
edges:
  - from: probe
    to: missing
    on: failure
  - from: probe
    to: expected
  - from: expected
    to: confirm
    when: true
  - from: expected
    to: moved
    when: false
  - from: confirm
    to: notify
